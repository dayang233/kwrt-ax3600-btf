name: Build OpenWrt 25.12 AX3600 (BTF + honk)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget libelf-dev ecj fastjar java-propose-classpath \
            python3-setuptools python3-pyelftools swig time dwarves

      - name: Clone OpenWrt 25.12
        run: git clone --depth 1 --branch openwrt-25.12 https://github.com/openwrt/openwrt openwrt

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-25.12-${{ hashFiles('configs/ax3600-btf.config') }}
          restore-keys: openwrt-dl-25.12-

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add honk packages from kiddin9 feed
        run: |
          git clone --depth 1 https://github.com/kiddin9/op-packages.git /tmp/op-packages
          cp -r /tmp/op-packages/honk /tmp/op-packages/luci-app-honk openwrt/package/
          ls openwrt/package/honk/files/config.d

      - name: Apply config seed
        working-directory: openwrt
        run: |
          cp ../configs/ax3600-btf.config .config
          make defconfig
          echo "--- target/device ---"
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq807x(_DEVICE_xiaomi_ax3600)?)=' .config
          echo "--- BTF ---"
          grep -E '^CONFIG_KERNEL_DEBUG_INFO(_BTF|_REDUCED)?=' .config || true
          if ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config; then
            echo "::error::CONFIG_KERNEL_DEBUG_INFO_BTF not enabled, aborting"
            exit 1
          fi
          echo "--- honk ---"
          grep -E '^CONFIG_(PACKAGE_(honk|luci-app-honk)|HONK_USE_KERNEL_BTF)=' .config || true

      - name: Copy first-boot safety files
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cp files/99-honk-safe openwrt/files/etc/uci-defaults/99-honk-safe
          chmod +x openwrt/files/etc/uci-defaults/99-honk-safe

      - name: Build firmware
        id: build
        working-directory: openwrt
        continue-on-error: true
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee ../build.log | tail -n 300

      - name: Kernel diagnostics
        if: always()
        run: |
          echo "== all vmlinux files =="
          find openwrt/build_dir -type f -name vmlinux -exec sh -c 'echo "--- $1"; ls -lh "$1"; file "$1"; readelf -h "$1" 2>&1 | head -3' _ {} \;

      - name: Verify BTF in kernel ELF
        if: steps.build.outcome == 'success'
        working-directory: openwrt
        run: |
          V=$(find build_dir -type f -path '*/linux-[0-9]*/vmlinux' | head -n 1)
          [ -n "$V" ] || V=$(find build_dir -type f -name 'vmlinux' -size +50M | head -n 1)
          echo "kernel ELF: $V"
          ls -lh "$V"
          readelf -S "$V" | grep -i '\.BTF' || { echo "::error::no .BTF section in $V"; exit 1; }

      - name: Collect artifacts
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out
          find openwrt/bin/targets -name '*sysupgrade.bin' -exec cp -v {} out/ \;
          find openwrt/bin/targets -name '*factory.ubi' -exec cp -v {} out/ \; || true
          cd out && sha256sum * > sha256sums.txt && ls -lh

      - name: Upload firmware
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ax3600-btf-honk
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::make failed, see build-log artifact"
          exit 1
