name: Build Kwrt AX3600 (BTF + honk)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget libelf-dev ecj fastjar java-propose-classpath \
            python3-setuptools python3-pyelftools swig time dwarves

      - name: Clone Kwrt
        run: git clone --depth 1 --branch master https://github.com/kiddin9/Kwrt openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config seed
        working-directory: openwrt
        run: |
          cp ../configs/ax3600-btf.config .config
          make defconfig
          echo "--- target/device ---"
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq807x(_DEVICE_xiaomi_ax3600)?)=' .config
          echo "--- BTF ---"
          grep -E '^CONFIG_KERNEL_DEBUG_INFO(_BTF|_REDUCED)?=' .config || true
          if ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config; then
            echo "::error::CONFIG_KERNEL_DEBUG_INFO_BTF not enabled, aborting"
            exit 1
          fi
          echo "--- honk ---"
          grep -E '^CONFIG_PACKAGE_(honk|luci-app-honk)=' .config || true

      - name: Copy first-boot safety files
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cp files/99-honk-safe openwrt/files/etc/uci-defaults/99-honk-safe
          chmod +x openwrt/files/etc/uci-defaults/99-honk-safe

      - name: Download sources
        working-directory: openwrt
        run: make -j$(nproc) download

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) 2>&1 | tail -n 300

      - name: Verify vmlinux has BTF
        working-directory: openwrt
        run: |
          VMLINUX=$(find build_dir -type f -name vmlinux | head -n 1)
          echo "vmlinux: $VMLINUX"
          ls -lh "$VMLINUX"
          readelf -S "$VMLINUX" | grep -i '\.BTF' || { echo "::error::no .BTF section"; exit 1; }

      - name: Collect artifacts
        run: |
          mkdir -p out
          find openwrt/bin/targets -name '*sysupgrade.bin' -exec cp -v {} out/ \;
          find openwrt/bin/targets -name '*factory.ubi' -exec cp -v {} out/ \; || true
          cd out && sha256sum * > sha256sums.txt && ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-ax3600-btf-honk
          path: out/*
          if-no-files-found: error
          retention-days: 14
